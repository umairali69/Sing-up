
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background-image: linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),url(forest-bg.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-box {
            width: 90%;
            max-width: 420px;
            min-height: 400px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            text-align: center;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
            background-color: rgba(255,255,255,0.08);
            backdrop-filter: blur(5px);
        }

        .main-box h1 {
            font-size: 28px;
            color: white;
            margin-bottom: 15px;
        }

        .inp {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper {
            width: 90%;
            position: relative;
            margin-bottom: 12px;
        }

        .wrapper input {
            width: 100%;
            height: 40px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 25px;
            background-color: transparent;
            color: white;
            padding: 0 40px 0 12px;
            outline: none;
        }

        .wrapper input::placeholder {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
        }

        .wrapper i {
            color: white;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
        }

        .chek-b {
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 11px;
            margin: 12px 0 20px;
        }

        .chek-b a {
            color: white;
            text-decoration: none;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .remember i {
            font-size: 10px;
        }

        .btn {
            width: 90%;
        }

        .btn button {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 25px;
            background-color: white;
            color: black;
            cursor: pointer;
        }

        .main-box p {
            color: white;
            font-size: 12px;
            margin-top: 15px;
        }

        .main-box p a {
            color: white;
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="header">

        <div class="main-box">

            <h1>Login</h1>

            <div class="inp">

                <div class="wrapper">
                    <input type="text" placeholder="Username">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="wrapper">
                    <input type="password" placeholder="Password">
                    <i class="fa-solid fa-lock"></i>
                </div>

            </div>

            <div class="chek-b">

                <div class="remember">
                    <i class="fa-solid fa-lock"></i>
                    <label for="Remember">Remember Me</label>
                </div>

                <a href="#">Forgot Password?</a>

            </div>

            <div class="btn">
                <button>Submit</button>
            </div>

            <p>
                Don't have an account?
                <a href="#">Register</a>
            </p>

        </div>

    </div>

</body>
</html>
