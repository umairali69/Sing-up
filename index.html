
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #EAECEF;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-box {
            width: 80%;
            max-width: 950px;
            min-height: 550px;
            display: flex;
            text-align: center;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .left {
            width: 50%;
            background-color: #FF4B2B;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 25px;
        }

        .left h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .left p {
            line-height: 1.7;
            margin-bottom: 25px;
        }


        .right {
            width: 50%;
            background-color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 35px;
        }

        .right h1 {
            font-size: 32px;
            margin-bottom: 25px;
        }

        .icon-2 {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .icon-2 i {
            width: 40px;
            height: 40px;
            border: 1px solid #ddd;
            border-radius: 40%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .right p {
            margin-bottom: 20px;
            color: #777;
        }

        .input {
            width: 100%;
            max-width: 320px;
        }

        .input input {
            width: 100%;
            padding: 13px;
            margin-bottom: 12px;
            border: none;
            outline: none;
            background-color: #EEEEEE;
            border-radius: 5px;
        }

        .check-box {
            margin: 10px 0 20px;
        }

        .check-box label {
            font-size: 14px;
        }

        

        button {
            padding: 12px 35px;
            border: none;
            border-radius: 25px;
            background-color: #FF4B2B;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* button:hover {
            background-color: #e63d20;
        } */

        .left button {
            border: 1px solid white;
        }

        /* .left button:hover {
            background-color: white;
            color: #FF4B2B;
        } */


    </style>
</head>

<body>

    <div class="main-box">

        <div class="left">

            <div class="icon">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>

            <h1>Welcome Back!</h1>

            <p>
                To keep connected with us please login
                <br>
                with your personal info
            </p>

            <div class="btn">
                <button>
                    <i class="fa-solid fa-arrow-left"></i>
                    LOG IN
                </button>
            </div>

        </div>

        <div class="right">

            <h1>Sign Up</h1>

            <div class="icon-2">
                <i class="fa-brands fa-facebook-f"></i>
                <i class="fa-brands fa-x-twitter"></i>
                <i class="fa-brands fa-github"></i>
                <i class="fa-brands fa-linkedin-in"></i>
            </div>

            <p>-OR-</p>

            <div class="input">
                <input type="text" placeholder="Name">
                <input type="email" placeholder="Email">
                <input type="password" placeholder="Password">
            </div>

            <div class="check-box">
                <input type="checkbox" id="accept">
                <label for="accept">I accept terms</label>
            </div>

            <div class="reg-btn">
                <button>REGISTER</button>
            </div>

        </div>

    </div>

</body>
</html>
